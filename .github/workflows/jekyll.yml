name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write # post build failure logs on PRs for debugging

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Validates every PR and push: installs dependencies and builds the site.
  # This job never touches Pages, so it passes even before Pages is enabled.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: |
          set -o pipefail
          bundle exec jekyll build --trace --verbose 2>&1 | tee build.log
        env:
          JEKYLL_ENV: production

      # TEMPORARY debug aid: surface the build log on the PR until green.
      - name: Report build failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          {
            echo "## Jekyll build failed"
            echo '```'
            grep -iE "error|exception|invalid|Traceback|raise |warning" build.log | tail -40
            echo '```'
            echo "### Tail of build.log"
            echo '```'
            tail -25 build.log
            echo '```'
          } > report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the deployable Pages artifact. Runs on main (and manual runs),
  # skipped on PRs. Requires Pages to be enabled once in repo settings:
  # Settings → Pages → Source → "GitHub Actions".
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically on first run (no-op once enabled)
          enablement: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --trace
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
